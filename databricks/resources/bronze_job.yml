# Runs the bronze pipeline every 15 minutes.
# The app lands a file every 2 minutes; each run ingests all files that arrived
# since the last one, because Auto Loader's checkpoint remembers what it has seen.
# A pipeline has no schedule of its own in a bundle: schedules belong to jobs.
resources:
  jobs:
    rail_pulse_bronze_every_15m:
      name: rail_pulse_bronze_every_15m
      max_concurrent_runs: 1
      schedule:
        quartz_cron_expression: "0 0/15 * * * ?"   # second minute hour day month weekday
        timezone_id: UTC
        pause_status: UNPAUSED   # development mode pauses schedules unless set per job
      tasks:
        - task_key: refresh_bronze
          pipeline_task:
            pipeline_id: ${resources.pipelines.rail_pulse_bronze.id}
